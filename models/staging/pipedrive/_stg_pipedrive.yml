version: 2

models:
  - name: stg_pipedrive__deal_changes
    description: Deal field updates, renamed and still one row per source event.
    columns:
      - name: deal_id
        data_tests:
          - not_null
      - name: changed_at
        data_tests:
          - not_null
      - name: field_key
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["add_time", "user_id", "stage_id", "lost_reason"]
      - name: new_value
        data_tests:
          - not_null

  - name: stg_pipedrive__deal_fields
    description: Deal field dictionary, one row per field.
    columns:
      - name: field_id
        data_tests:
          - not_null
          - unique
      - name: field_key
        data_tests:
          - not_null
          - unique

  - name: stg_pipedrive__stages
    description: Pipeline stages. stage_id is the funnel order.
    columns:
      - name: stage_id
        data_tests:
          - not_null
          - unique
      - name: stage_name
        data_tests:
          - not_null

  - name: stg_pipedrive__activities
    description: >
      One row per activity. activity_id is reused across deals in this extract,
      so it is not a primary key. Most activity deal_ids are absent from the
      deal changelog; the two extracts are separate populations.
    columns:
      - name: activity_id
        data_tests:
          - not_null
      - name: activity_type_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_pipedrive__activity_types')
                field: activity_type_key
      - name: assigned_user_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_pipedrive__users')
                field: user_id
      - name: deal_id
        data_tests:
          - not_null
      - name: is_done
        data_tests:
          - not_null
      - name: due_at
        data_tests:
          - not_null

  - name: stg_pipedrive__activity_types
    description: Activity type catalog. activity_type_key joins to activities.
    columns:
      - name: activity_type_id
        data_tests:
          - not_null
          - unique
      - name: activity_type_key
        data_tests:
          - not_null
          - unique
      - name: activity_type_name
        data_tests:
          - not_null
      - name: is_active
        data_tests:
          - not_null

  - name: stg_pipedrive__users
    description: Pipedrive users. Email is not unique in this extract.
    columns:
      - name: user_id
        data_tests:
          - not_null
          - unique
      - name: user_name
        data_tests:
          - not_null
