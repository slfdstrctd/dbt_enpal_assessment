version: 2

seeds:
  - name: funnel_steps
    description: >
      Canonical mapping of source events to the eleven required sales-funnel
      steps. The mapping is data, rather than report SQL, so future changes are
      explicit and testable.
    config:
      column_types:
        source_type: text
        source_key: text
        funnel_step: text
        kpi_name: text
        sort_order: integer
    columns:
      - name: source_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [creation, stage, activity]
      - name: source_key
        data_tests:
          - not_null
      - name: funnel_step
        data_tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values: ['1', '2', '2.1', '3', '3.1', '4', '5', '6', '7', '8', '9']
      - name: kpi_name
        data_tests:
          - not_null
          - unique
      - name: sort_order
        data_tests:
          - not_null
          - unique

